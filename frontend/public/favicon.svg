<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fundo escuro premium -->
  <rect width="512" height="512" rx="128" fill="#121212"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#2D2D2D" stroke-width="8"/>

  <!-- Letra 'R' branca estilizada -->
  <text x="90" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="240" font-weight="900" fill="#FFFFFF" letter-spacing="-8">R</text>

  <!-- Letra 'M' em Dourado reluzente -->
  <text x="240" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="240" font-weight="900" fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="-8">M</text>

  <!-- Ponto de destaque restaurante (prato/cloche minimalista) -->
  <circle cx="445" cy="180" r="18" fill="url(#goldGrad)"/>
</svg>
